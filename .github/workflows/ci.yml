name: ci

# Validate the tap formula: lint/audit it, and prove it actually installs the
# pinned release binary and passes its `test do` block on macOS + Linux.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: brew style + audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      # GitHub's ubuntu images ship Homebrew but do not put it on PATH.
      - name: Put Homebrew on PATH
        run: test ! -d /home/linuxbrew/.linuxbrew/bin || echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: brew style
        run: brew style Formula/dpm.rb
      - name: brew audit (strict, online — checks URLs + checksums)
        run: |
          brew tap declarative-migrations/tap "$GITHUB_WORKSPACE"
          brew audit --strict --online --tap declarative-migrations/tap dpm

  install-test:
    name: install + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      # macOS has brew on PATH already; ubuntu ships it under /home/linuxbrew.
      - name: Put Homebrew on PATH
        run: test ! -d /home/linuxbrew/.linuxbrew/bin || echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install the formula from this checkout
        run: |
          brew tap declarative-migrations/tap "$GITHUB_WORKSPACE"
          brew install --formula declarative-migrations/tap/dpm
      - name: Run the formula test block
        run: brew test declarative-migrations/tap/dpm
      - name: Smoke-check the binary
        run: |
          dpm version
          dpm help | grep -qi 'declarative postgres migrate'
